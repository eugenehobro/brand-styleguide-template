<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Header — BRINC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-sans: 'Manrope', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --brand-blue: #00d2ff;
    --brand-blue-hover: #5be2ff;
    --brand-black: #0a0a0a;
    --brand-white: #f9f9f9;

    --semantic-text-button: #0a0a0a;
    --semantic-icon-border: #484848;

    --font-weight-semibold: 600;
    --font-weight-medium: 500;
    --font-weight-regular: 400;

    --button-radius: 81px;
    --header-height: 91px;
    --header-padding-x: 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--brand-black);
    color: var(--brand-white);
    font-family: var(--font-sans);
    scroll-behavior: smooth;
  }

  img, svg { max-width: 100%; display: block; }
  a { color: inherit; }
  button { font-family: inherit; }

  /* ================= Header (from Integrations Landing Page, Iteration #02 — brinc-integrations.html) ================= */

  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--header-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--header-padding-x);
    z-index: 100;
    background: transparent;
    transition: background 0.2s ease, backdrop-filter 0.2s ease;
  }

  .site-header.is-scrolled {
    background: rgba(10, 10, 10, 0.46);
    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);
  }

  .logo { display: block; width: 100px; height: 26px; flex-shrink: 0; }
  .logo svg { width: 100%; height: 100%; }

  .main-nav {
    display: flex;
    align-items: center;
    gap: 40px;
    list-style: none;
  }

  .main-nav a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: var(--font-weight-medium);
    text-decoration: none;
    color: var(--brand-white);
    position: relative;
    padding: 4px 0;
  }

  .main-nav a::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 0;
    height: 1px;
    background: var(--brand-blue);
    transition: width 0.2s ease;
  }

  .main-nav a:hover::after { width: 100%; }
  .main-nav a:hover { color: var(--brand-blue); }
  .main-nav svg { width: 10px; height: 10px; opacity: 0.7; }

  .header-actions { display: flex; align-items: center; gap: 12px; }

  .btn-ghost {
    height: 40px;
    padding: 0 20px;
    border-radius: var(--button-radius);
    border: 1px solid var(--semantic-icon-border);
    background: transparent;
    color: var(--brand-white);
    font-size: 14px;
    font-weight: var(--font-weight-medium);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .btn-ghost:hover { border-color: var(--brand-blue); background: rgba(0, 210, 255, 0.08); }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    padding: 0 24px;
    border-radius: var(--button-radius);
    background: var(--brand-blue);
    color: var(--semantic-text-button);
    font-family: var(--font-sans);
    font-weight: var(--font-weight-medium);
    font-size: 14px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .btn-primary:hover { background: var(--brand-blue-hover); transform: translateY(-1px); }

  @media (max-width: 900px) {
    .site-header { padding-left: 24px; padding-right: 24px; }
    .main-nav { display: none; }
  }

  /* ================= Demo scaffold (not part of the component — gives the fixed header something to scroll over) ================= */

  .demo-scroll-spacer {
    height: 200vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(249, 249, 249, 0.35);
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
</style>
</head>

  <div class="demo-scroll-spacer">Scroll to see the header's blurred "is-scrolled" state</div>

<script>
  const header = document.getElementById('siteHeader');
  window.addEventListener('scroll', () => {
    header.classList.toggle('is-scrolled', window.scrollY > 8);
  });
</script>
